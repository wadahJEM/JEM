<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العدل والمساواة نيوز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#141414;--mute:#5b5b5b;--line:#e2e2de;--g:#1e7b34;--r:#c8102e;--k:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1b1b1b;--ink:#f1f1ee;--mute:#a5a5a0;--line:#2c2c2c;--g:#3fb85b;--r:#ef4a63;--k:#000}}
:root[data-theme="dark"]{--bg:#121212;--card:#1b1b1b;--ink:#f1f1ee;--mute:#a5a5a0;--line:#2c2c2c;--g:#3fb85b;--r:#ef4a63;--k:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.tri{height:6px;background:linear-gradient(90deg,var(--g) 33.3%,var(--k) 33.3% 66.6%,var(--r) 66.6%)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header .top{display:flex;align-items:center;gap:14px;padding:14px 0}
header img{width:72px;height:72px;border-radius:50%;background:#fff}
.brand h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);font-weight:900;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--mute);font-size:.88rem;font-weight:600}
.theme{margin-inline-start:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:.8rem;cursor:pointer}
nav{border-block:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:10px 14px;white-space:nowrap;font-weight:600;font-size:.95rem;border-bottom:3px solid transparent}
nav a:first-child{border-color:var(--r)}nav a:hover{border-color:var(--g)}
.ticker{background:var(--k);color:#fff;display:flex;align-items:stretch;overflow:hidden}
.ticker b{background:var(--r);padding:6px 14px;font-weight:800;white-space:nowrap}
.ticker span{padding:6px 14px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
main{padding:20px 0 8px}
.lead{display:grid;gap:16px;grid-template-columns:1.6fr 1fr}
.hero{background:var(--k);color:#fff;border-radius:6px;padding:28px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--g) 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}
.hero h2{margin:8px 0;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:900;line-height:1.35}
.hero p{margin:0;color:#d4d4d0}
.tag{display:inline-block;font-size:.78rem;font-weight:800;color:#fff;background:var(--g);padding:1px 10px;border-radius:3px;align-self:flex-start}
.tag.r{background:var(--r)}
.side{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 16px}
.side h3,.sec h3{margin:12px 0 4px;font-size:1.15rem;font-weight:800;border-inline-start:5px solid var(--r);padding-inline-start:10px}
.side a{display:block;padding:10px 0;border-top:1px solid var(--line);font-weight:600;font-size:.95rem}
.side time,.card time{display:block;color:var(--mute);font-size:.78rem;font-weight:400}
.sec{margin-top:26px}
.sec h3{border-color:var(--g);margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;border-top:4px solid var(--g)}
.card:nth-child(3n+2){border-top-color:var(--k)}.card:nth-child(3n){border-top-color:var(--r)}
.card h4{margin:6px 0;font-size:1.05rem;font-weight:800;line-height:1.5}
.card p{margin:0 0 6px;color:var(--mute);font-size:.9rem}
.note{margin-top:22px;font-size:.8rem;color:var(--mute);text-align:center}
footer{margin-top:30px;background:var(--k);color:#d4d4d0;text-align:center;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px))}
footer q{display:block;font-size:1.15rem;font-weight:800;color:#fff;quotes:none;margin-bottom:6px}
footer small{font-size:.8rem}
@media(max-width:760px){.lead,.grid{grid-template-columns:1fr}header img{width:56px;height:56px}.hero{min-height:240px}}

/* إضافات اختيارية؛ تحافظ على هوية التصميم الأصلي */
.facebook-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:38px;height:38px;border-radius:50%;background:#1877f2;color:#fff!important;font:bold 28px Arial,sans-serif;flex-shrink:0}
.footer-facebook{width:auto;height:auto;padding:7px 14px;border-radius:24px;font-size:20px;margin:0 auto 12px}
.footer-facebook span{font:600 14px Cairo,Tahoma,sans-serif}
.admin-panel{position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--ink);overflow:auto;padding:18px;display:none}
.admin-panel.open{display:block}
.admin-inner{max-width:1000px;margin:auto}
.admin-panel input,.admin-panel textarea,.admin-panel select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin:4px 0 12px}
.admin-panel textarea{min-height:90px}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.admin-btn{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.admin-btn.primary{background:var(--g);color:white;border-color:var(--g)}
.admin-btn.danger{background:var(--r);color:white;border-color:var(--r)}
.admin-box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:14px 0}
.admin-list-item{padding:12px 0;border-bottom:1px solid var(--line)}
.admin-list-item:last-child{border-bottom:0}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.admin-msg{padding:10px;background:var(--card);border:1px solid var(--line);margin:10px 0}
@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.facebook-link{width:34px;height:34px}}

</style>
</head>
