<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة العدل والمساواة نيوز</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet"><style>:root{--g:#1e7b34;--r:#c8102e;--ink:#171717;--bg:#f7f7f5;--card:#fff;--line:#e2e2de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}.topline{height:6px;background:linear-gradient(90deg,var(--g) 33.3%,#111 33.3% 66.6%,var(--r) 66.6%)}main{max-width:950px;margin:24px auto;padding:0 14px}.head,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}h1{margin:0;font-size:1.6rem}h2{margin:0 0 12px;font-size:1.15rem;border-right:4px solid var(--g);padding-right:10px}.muted,small{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:700}input,textarea{font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px;margin:4px 0 12px;background:#fff;color:#111}label>input:not([type=checkbox]),textarea{width:100%}textarea{min-height:100px}button{font:inherit;border:0;border-radius:6px;padding:9px 15px;background:var(--g);color:white;cursor:pointer;margin:3px}button.secondary{background:#222}button.danger{background:var(--r)}.msg{padding:10px;background:#f1f5f1;border:1px solid #cbdccb;border-radius:6px;margin:10px 0;white-space:pre-wrap}.item{border-top:1px solid var(--line);padding:12px 0}.item h3{margin:0 0 5px}.item p{margin:0 0 8px;color:#555}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin:12px auto}.head,.panel{padding:14px}}</style></head><body><div class="topline"></div><main><header class="head"><h1>العدل والمساواة نيوز</h1><div class="muted">لوحة إدارة الأخبار — تتطلب حساب مدير مصرحًا به.</div></header><section id="login" class="panel"><h2>دخول المدير</h2><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>تسجيل الدخول</button></form><div id="loginMsg" class="msg hidden"></div></section><section id="dashboard" class="hidden"><div class="panel"><button id="logout" class="secondary">تسجيل الخروج</button><div id="status" class="msg">متصل.</div></div><div class="panel"><h2 id="formTitle">إضافة خبر</h2><form id="newsForm"><input id="newsId" type="hidden"><label>عنوان الخبر<input id="title" required maxlength="250"></label><div class="grid"><label>التصنيف<input id="category" value="أخبار" maxlength="80"></label><label>رابط المصدر<input id="source" type="url" placeholder="https://"></label></div><label>ملخص الخبر<textarea id="summary" maxlength="1500"></textarea></label><label>نص الخبر<textarea id="body" required></textarea></label><div class="grid"><label><input id="breaking" type="checkbox"> خبر عاجل</label><label><input id="published" type="checkbox" checked> نشر للزوار</label></div><button>حفظ الخبر</button><button type="button" id="cancelEdit" class="secondary hidden">إلغاء التعديل</button></form></div><div class="panel"><h2>الأخبار المحفوظة</h2><div id="newsList"></div></div></section><footer class="muted">استخدم المفتاح العام فقط في المتصفح. لا تضع مفتاحًا سريًا في HTML.</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://sqrrxfrwclmjvxhvmopl.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Ky_uJQvshLeky1z3wyc42Q_yzweZGWh';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);const msg=(id,s)=>{$(id).textContent=s;show(id,true)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadNews(){msg('status','جارٍ تحميل الأخبار…');const {data,error}=await db.from('news').select('id,title,category,summary,body,published_at,source_url,is_breaking,is_published').order('published_at',{ascending:false});if(error){msg('status','خطأ تحميل: '+error.message);return} $('newsList').innerHTML=data.length?data.map(n=>`<article class="item"><h3>${esc(n.title)}</h3><p>${esc(n.summary||'بدون ملخص')}</p><small>${esc(n.category)} · ${n.is_published?'منشور':'مسودة'} ${n.is_breaking?'· عاجل':''}</small><div><button class="secondary" data-edit="${n.id}">تعديل</button><button class="danger" data-del="${n.id}">حذف</button></div></article>`).join(''):'لا توجد أخبار بعد.';msg('status','تم الاتصال بقاعدة البيانات. عدد الأخبار: '+data.length);$('newsList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(data.find(n=>n.id===b.dataset.edit)));$('newsList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}
function edit(n){$('newsId').value=n.id;$('title').value=n.title||'';$('category').value=n.category||'أخبار';$('source').value=n.source_url||'';$('summary').value=n.summary||'';$('body').value=n.body||'';$('breaking').checked=!!n.is_breaking;$('published').checked=!!n.is_published;$('formTitle').textContent='تعديل خبر';show('cancelEdit');$('newsForm').scrollIntoView({behavior:'smooth'})}function reset(){ $('newsForm').reset();$('newsId').value='';$('category').value='أخبار';$('published').checked=true;$('formTitle').textContent='إضافة خبر';show('cancelEdit',false)}$('cancelEdit').onclick=reset;
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','جارٍ التحقق…');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','فشل الدخول: '+error.message);return}if(data.user?.app_metadata?.role!=='admin'){await db.auth.signOut();msg('loginMsg','الحساب ليس مديرًا. يجب تعيين app_metadata.role = admin من إعدادات موثوقة في Supabase.');return}show('login',false);show('dashboard');loadNews()};$('logout').onclick=async()=>{await db.auth.signOut();show('dashboard',false);show('login');msg('loginMsg','تم تسجيل الخروج.')};$('newsForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();if(user?.app_metadata?.role!=='admin'){msg('status','الحساب لا يملك صلاحية المدير.');return}const p={title:$('title').value.trim(),category:$('category').value.trim()||'أخبار',source_url:$('source').value.trim()||null,summary:$('summary').value.trim(),body:$('body').value.trim(),is_breaking:$('breaking').checked,is_published:$('published').checked,updated_at:new Date().toISOString()};const id=$('newsId').value;const r=id?await db.from('news').update(p).eq('id',id):await db.from('news').insert(p);if(r.error){msg('status','فشل الحفظ: '+r.error.message);return}reset();await loadNews()};async function del(id){if(!confirm('حذف الخبر نهائيًا؟'))return;const {error}=await db.from('news').delete().eq('id',id);if(error){msg('status','فشل الحذف: '+error.message);return}loadNews()}db.auth.getSession().then(async({data})=>{if(data.session&&data.session.user?.app_metadata?.role==='admin'){show('login',false);show('dashboard');loadNews()}else if(data.session)await db.auth.signOut()});
</script></body></html>
